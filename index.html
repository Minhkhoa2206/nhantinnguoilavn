# Nova Stranger - Full Realtime Chat App

```html
<!DOCTYPE html>

<style>
:root{
    --bg:#020617;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

html,body{
    width:100%;
    height:100%;

body{
    color:white;
    position:relative;
}

body::before{
    content:"";
    position:fixed;
    inset:0;

    radial-gradient(white 1px, transparent 1px),
    radial-gradient(#60a5fa 1px, transparent 1px),

@keyframes heartFall{

        transform:translateY(110vh) rotate(360deg);

.app{
    width:100%;
    height:100dvh;
    display:flex;

}

.topbar{
    height:72px;
    background:rgba(15,23,42,.58);
    backdrop-filter:blur(18px);
    border-bottom:1px solid rgba(255,255,255,.05);
    display:flex;
    align-items:center;

    padding:0 16px;
}

.top-left{
    display:flex;
    align-items:center;

}

    width:50px;
    height:50px;
    border-radius:18px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;

}

    display:flex;

}

}

    background:linear-gradient(135deg,#dc2626,#b91c1c);
}

    background:linear-gradient(135deg,#334155,#0f172a);
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:16px;
    display:flex;
    flex-direction:column;

}

.row{
    display:flex;
}

.row.me{
    justify-content:flex-end;
}

.msg-wrap{
    display:flex;
    align-items:flex-end;

}

.row.me .msg-wrap{
    flex-direction:row-reverse;
}

.avatar{
    width:42px;
    height:42px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;

    flex-shrink:0;
    border:2px solid rgba(255,255,255,.15);
}

.msg{
    max-width:82%;
    background:rgba(30,41,59,.6);
    backdrop-filter:blur(12px);
    padding:12px;
    border-radius:22px;

}

.row.me .msg{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
}

.username{
    font-size:12px;
    font-weight:700;
    margin-bottom:6px;
    color:#cbd5e1;
}

.text{
    font-size:15px;
    line-height:1.55;
    word-break:break-word;
}

.link{
    color:#93c5fd;
    text-decoration:none;
    font-weight:600;

}

    width:100%;
    max-width:260px;
    border-radius:16px;

}

.bottom{
    background:rgba(15,23,42,.58);
    backdrop-filter:blur(18px);
    border-top:1px solid rgba(255,255,255,.05);
    padding:10px;
}

.sendbox{
    display:flex;
    gap:8px;
}

.image-btn,
.send-btn{
    width:52px;
    height:52px;
    border:none;
    border-radius:16px;
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:white;
    display:flex;
    align-items:center;
    justify-content:center;
    cursor:pointer;
    font-size:18px;
}

.send-input{
    flex:1;
    border:none;
    outline:none;
    background:rgba(255,255,255,.06);
    color:white;
    padding:0 14px;
    border-radius:16px;

}

.image-viewer{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.95);
    display:none;

    max-width:100%;

}

</head>
<body>

<div class="auth-screen" id="authScreen">
    <div class="auth-box">
        <div class="auth-title">✦ Nova Stranger</div>

        <input id="username" placeholder="Tên tài khoản">
        <input id="password" type="password" placeholder="Mật khẩu">

        <button class="auth-btn" id="loginBtn">
            Đăng nhập
        </button>

        <button class="auth-btn" id="registerBtn">
            Tạo tài khoản
        </button>
    </div>
</div>

<div class="finding" id="finding">
    <div class="loader"></div>

    <div style="font-size:26px;font-weight:800;">
        Đang tìm người lạ...
    </div>

    <button id="findingLogoutBtn" class="finding-logout">
        Logout
    </button>
</div>

<div class="app">

    <div class="topbar">

        <div class="top-left">
            <div class="logo">✦</div>

            <div class="info">
                <div class="title">Nova Stranger</div>

                <div class="status" id="status">
                    ● Offline
                </div>
            </div>
        </div>

        <div class="top-actions">

            <button id="logoutBtn" class="top-btn logout-btn">
                Logout
            </button>

            <button id="nextBtn" class="top-btn next-btn">
                Next
            </button>

        </div>

    </div>

    <div id="messages" class="messages"></div>

    <div class="bottom">

        <div class="sendbox">

            <label class="image-btn" for="imageInput">
                📷
            </label>

            <input type="file" id="imageInput" accept="image/*" hidden>

            <input id="messageInput" class="send-input" placeholder="Nhắn gì đó...">

            <button id="sendBtn" class="send-btn">
                ➤
            </button>

        </div>

    </div>

</div>

<div id="imageViewer" class="image-viewer">
    <img id="viewerImage" class="viewer-image">
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

firebase.initializeApp({

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
databaseURL: "YOUR_DATABASE_URL",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "123456",
appId: "YOUR_APP_ID",

});

const db = firebase.database();

const authScreen = document.getElementById("authScreen");
const usernameInput = document.getElementById("username");
const passwordInput = document.getElementById("password");
const loginBtn = document.getElementById("loginBtn");
const registerBtn = document.getElementById("registerBtn");
const logoutBtn = document.getElementById("logoutBtn");
const findingLogoutBtn = document.getElementById("findingLogoutBtn");
const messages = document.getElementById("messages");
const sendBtn = document.getElementById("sendBtn");
const nextBtn = document.getElementById("nextBtn");
const messageInput = document.getElementById("messageInput");
const statusEl = document.getElementById("status");
const finding = document.getElementById("finding");
const imageInput = document.getElementById("imageInput");
const imageViewer = document.getElementById("imageViewer");
const viewerImage = document.getElementById("viewerImage");

const animals = ["🐶","🐱","🦊","🐼","🐸","🐵","🐰","🦁","🐯","🐨"];

const avatarColors = [
"linear-gradient(135deg,#2563eb,#7c3aed)",
"linear-gradient(135deg,#ec4899,#8b5cf6)",
"linear-gradient(135deg,#06b6d4,#3b82f6)",
"linear-gradient(135deg,#f97316,#ef4444)"
];

let myAnimal = localStorage.getItem("nova_animal");
let myAvatarColor = localStorage.getItem("nova_avatar_color");

if(!myAnimal){
    myAnimal = animals[Math.floor(Math.random()*animals.length)];
    localStorage.setItem("nova_animal",myAnimal);
}

if(!myAvatarColor){
    myAvatarColor = avatarColors[Math.floor(Math.random()*avatarColors.length)];
    localStorage.setItem("nova_avatar_color",myAvatarColor);
}

let myId = localStorage.getItem("nova_user_id");
let myUsername = localStorage.getItem("nova_username");
let loggedIn = localStorage.getItem("nova_logged_in");

let roomId = null;
let loaded = false;

function safe(text){
    return String(text)
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

function linkify(text){

    const urlRegex = /((https?:\/\/)?([a-zA-Z0-9-]+\.)+[a-zA-Z]{2,}(\/\S*)?)/g;

    return safe(text)
    .replace(urlRegex,(url)=>{

        let href = url;

        if(!href.startsWith("http")){
            href = "https://" + href;
        }

        return `
        <a href="${href}" target="_blank" class="link">
            🔗 ${url}
        </a>
        `;
    });
}

registerBtn.onclick = async ()=>{

    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    if(!username || !password){
        return alert("Nhập đủ đi 😭");
    }

    const snap = await db.ref("users")
    .orderByChild("username")
    .equalTo(username)
    .once("value");

    if(snap.exists()){
        return alert("Tên tồn tại 😭");
    }

    const uid = "user_" + Math.random().toString(36).slice(2);

    await db.ref("users/" + uid).set({
        username,
        password,
        createdAt:Date.now()
    });

    alert("Tạo tài khoản thành công ✨");
};

loginBtn.onclick = async ()=>{

    const username = usernameInput.value.trim();
    const password = passwordInput.value.trim();

    const snap = await db.ref("users")
    .orderByChild("username")
    .equalTo(username)
    .once("value");

    if(!snap.exists()){
        return alert("Không tồn tại 😭");
    }

    let ok = false;

    snap.forEach((s)=>{

        const data = s.val();

        if(data.password === password){

            ok = true;
            myId = s.key;
            myUsername = data.username;
        }
    });

    if(!ok){
        return alert("Sai mật khẩu 😭");
    }

    localStorage.setItem("nova_user_id",myId);
    localStorage.setItem("nova_username",myUsername);
    localStorage.setItem("nova_logged_in","1");

    authScreen.style.display = "none";

    await loadMyMessages();

    startSystem();
};

async function autoLogin(){

    if(!myId || !loggedIn) return;

    const snap = await db.ref("users/" + myId).once("value");

    if(snap.exists()){

        authScreen.style.display = "none";

        await loadMyMessages();

        startSystem();
    }
}

autoLogin();

async function loadMyMessages(){

    const snap = await db.ref("user_messages/" + myId).once("value");

    if(!snap.exists()) return;

    messages.innerHTML = "";

    snap.forEach((s)=>{
        renderMessage(s.val(),true);
    });

    messages.scrollTop = messages.scrollHeight;
}

async function startSystem(){

    roomId = localStorage.getItem("nova_room_" + myId);

    const ok = await restoreRoom();

    if(!ok){
        findPartner();
    }
}

async function restoreRoom(){

    if(!roomId) return false;

    const snap = await db.ref("rooms/" + roomId).once("value");

    if(snap.exists()){
        startChat();
        return true;
    }

    return false;
}

async function findPartner(){

    finding.style.display = "flex";

    const waitingRef = db.ref("waitingUsers");
    const snap = await waitingRef.once("value");

    let found = null;

    snap.forEach((s)=>{

        if(s.key !== myId && !found){
            found = s.key;
        }
    });

    if(found){

        roomId = "room_" + Date.now();

        localStorage.setItem(
            "nova_room_" + myId,
            roomId
        );

        await db.ref("rooms/" + roomId).set({
            users:{
                a:myId,
                b:found
            },
            createdAt:Date.now()
        });

        await waitingRef.child(found).remove();

        startChat();

    }else{

        await waitingRef.child(myId).set({
            time:Date.now()
        });

        waitingRef.on("child_removed",async (s)=>{

            if(s.key === myId){

                const rooms = await db.ref("rooms").once("value");

                rooms.forEach((r)=>{

                    const d = r.val();

                    if(
                        d.users &&
                        (
                            d.users.a === myId ||
                            d.users.b === myId
                        )
                    ){
                        roomId = r.key;
                    }
                });

                if(roomId){

                    localStorage.setItem(
                        "nova_room_" + myId,
                        roomId
                    );

                    startChat();
                }
            }
        });
    }
}

function renderMessage(data,forceMe=false){

    const row = document.createElement("div");

    row.className =
    "row " +
    (
        data.user === myId ||
        forceMe
        ? "me"
        : ""
    );

    row.innerHTML = `

    <div class="msg-wrap">

        <div class="avatar" style="background:${data.avatarColor}">
            ${data.animal}
        </div>

        <div class="msg">

            <div class="username">
                ${data.username || "Ẩn danh"}
            </div>

            ${
                data.text
                ?
                `
                <div class="text">
                    ${linkify(data.text)}
                </div>
                `
                :
                ""
            }

            ${
                data.image
                ?
                `
                <img
                    src="${data.image}"
                    class="chat-image"
                    onclick="openImageViewer('${data.image}')"
                >
                `
                :
                ""
            }

        </div>

    </div>

    `;

    messages.appendChild(row);

    messages.scrollTop = messages.scrollHeight;
}

function startChat(){

    if(loaded) return;

    loaded = true;

    finding.style.display = "none";

    statusEl.innerHTML = "● Đã kết nối";

    const onlineRef = db.ref(
        "rooms/" + roomId + "/online/" + myId
    );

    onlineRef.set(true);

    onlineRef.onDisconnect().remove();

    db.ref("rooms/" + roomId + "/online")
    .on("value",(snap)=>{

        const online = snap.val();

        if(
            online &&
            Object.keys(online).length >= 2
        ){
            statusEl.innerHTML = "● Đã kết nối";
        }else{
            statusEl.innerHTML = "● Người kia đã thoát 😢";
        }
    });

    db.ref("rooms/" + roomId + "/messages")
    .on("child_added",(snapshot)=>{

        const data = snapshot.val();

        renderMessage(data);
    });
}

function sendMessage(){

    const text = messageInput.value.trim();

    if(!text || !roomId) return;

    const msgData = {
        text:text,
        username:myUsername,
        user:myId,
        animal:myAnimal,
        avatarColor:myAvatarColor,
        roomId:roomId,
        time:Date.now()
    };

    db.ref("rooms/" + roomId + "/messages")
    .push(msgData);

    db.ref("user_messages/" + myId)
    .push(msgData);

    messageInput.value = "";
}

sendBtn.onclick = sendMessage;

messageInput.addEventListener("keydown",(e)=>{

    if(e.key === "Enter"){
        sendMessage();
    }
});

imageInput.addEventListener("change",()=>{

    const file = imageInput.files[0];

    if(!file) return;

    if(file.size > 1024 * 300){
        alert("Ảnh quá lớn 😭");
        return;
    }

    const reader = new FileReader();

    reader.onload = function(e){

        const msgData = {
            image:e.target.result,
            username:myUsername,
            user:myId,
            animal:myAnimal,
            avatarColor:myAvatarColor,
            roomId:roomId,
            time:Date.now()
        };

        db.ref("rooms/" + roomId + "/messages")
        .push(msgData);

        db.ref("user_messages/" + myId)
        .push(msgData);
    };

    reader.readAsDataURL(file);
});

nextBtn.onclick = async function(){

    if(roomId){

        await db.ref(
            "rooms/" + roomId + "/online/" + myId
        ).remove();
    }

    localStorage.removeItem(
        "nova_room_" + myId
    );

    location.reload();
};

async function logoutNow(){

    if(roomId){

        await db.ref(
            "rooms/" + roomId + "/online/" + myId
        ).remove();
    }

    localStorage.removeItem("nova_logged_in");
    localStorage.removeItem("nova_user_id");
    localStorage.removeItem("nova_username");

    location.reload();
}

logoutBtn.onclick = logoutNow;
findingLogoutBtn.onclick = logoutNow;

window.openImageViewer = function(src){

    viewerImage.src = src;

    imageViewer.style.display = "flex";
};

imageViewer.onclick = function(){
    imageViewer.style.display = "none";
};

setInterval(async ()=>{

    const rooms = await db.ref("rooms").once("value");

    rooms.forEach((room)=>{

        const data = room.val();

        if(
            !data.online ||
            Object.keys(data.online).length === 0
        ){
            db.ref("rooms/" + room.key).remove();
        }
    });

},60000);

</script>
</body>
</html>
