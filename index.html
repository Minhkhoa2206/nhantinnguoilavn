<!DOCTYPE html>

<head>
<meta charset="UTF-8"/>
<meta

/>

<title>Nova Stranger</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:
radial-gradient(circle at top,#0f172a,#020617);
height:100vh;
overflow:hidden;
color:white;
}

/* AUTH */

.auth{

position:fixed;
inset:0;

display:flex;
align-items:center;
justify-content:center;

background:#020617;

z-index:9999;
}

.auth-box{

width:90%;
max-width:340px;

background:
rgba(15,23,42,.95);

padding:22px;

border-radius:24px;

display:flex;
flex-direction:column;

gap:12px;
}

.auth-title{

font-size:28px;
font-weight:800;

text-align:center;
}

.auth-box input{

height:52px;

border:none;
outline:none;

padding:0 14px;

border-radius:14px;

background:#1e293b;

color:white;
}

.auth-btn{

height:52px;

border:none;

border-radius:14px;

cursor:pointer;

font-weight:700;

background:
linear-gradient(
135deg,
#2563eb,
#7c3aed
);

color:white;
}

/* FINDING */

.finding{

position:fixed;
inset:0;

display:none;
flex-direction:column;

align-items:center;
justify-content:center;

background:
rgba(2,6,23,.96);

z-index:999;

gap:18px;
}

.loader{

width:90px;
height:90px;

border-radius:50%;

border:
5px solid rgba(255,255,255,.1);

border-top:
5px solid #7c3aed;

animation:
spin 1s linear infinite;
}

@keyframes spin{

from{
transform:rotate(0);
}

to{
transform:rotate(360deg);
}

}

.finding button{

height:50px;

padding:0 18px;

border:none;

border-radius:14px;

cursor:pointer;

font-weight:700;

background:
linear-gradient(
135deg,
#334155,
#0f172a
);

color:white;
}

/* APP */

.app{

height:100vh;

display:flex;
flex-direction:column;
}

/* TOPBAR */

.topbar{

height:70px;

background:
rgba(15,23,42,.75);

display:flex;
align-items:center;
justify-content:space-between;

padding:0 14px;
}

.top-left{

display:flex;
flex-direction:column;
}

.logo{

font-size:20px;
font-weight:800;
}

.status{

font-size:13px;

margin-top:3px;

color:#4ade80;
}

.top-actions{

display:flex;
gap:8px;
}

.top-btn{

height:44px;

padding:0 16px;

border:none;

border-radius:14px;

cursor:pointer;

font-weight:700;

color:white;
}

.logout-btn{

background:
linear-gradient(
135deg,
#334155,
#0f172a
);

}

.next-btn{

background:
linear-gradient(
135deg,
#dc2626,
#b91c1c
);

}

/* MESSAGES */

.messages{

flex:1;

overflow-y:auto;

padding:14px;

display:flex;
flex-direction:column;

gap:12px;
}

.row{

display:flex;
}

.row.me{

justify-content:flex-end;
}

.msg{

max-width:80%;

background:#1e293b;

padding:12px;

border-radius:18px;

word-break:break-word;
}

.row.me .msg{

background:
linear-gradient(
135deg,
#2563eb,
#7c3aed
);

}

.username{

font-size:12px;

font-weight:700;

margin-bottom:5px;

opacity:.85;
}

/* BOTTOM */

.bottom{

padding:10px;

background:
rgba(15,23,42,.75);

display:flex;

gap:8px;
}

.message-input{

flex:1;

height:52px;

border:none;
outline:none;

padding:0 14px;

border-radius:14px;

background:#1e293b;

color:white;
}

.send-btn{

width:54px;
height:52px;

border:none;

border-radius:14px;

cursor:pointer;

font-size:20px;

background:
linear-gradient(
135deg,
#2563eb,
#7c3aed
);

color:white;
}

/* HEART */

.heart{

position:fixed;

top:-50px;

pointer-events:none;

z-index:999999;

animation:
heartFall linear forwards;
}

@keyframes heartFall{

from{

transform:
translateY(-50px)
rotate(0deg);

opacity:1;
}

to{

transform:
translateY(110vh)
rotate(360deg);

opacity:0;
}

}

</style>
</head>

<body>

<!-- AUTH -->

<div class="auth" id="auth">

<div class="auth-box">

<div class="auth-title">
✦ Nova Stranger
</div>

<input
id="username"
placeholder="Tên tài khoản"
>

<input
id="password"
type="password"
placeholder="Mật khẩu"
>

<button
class="auth-btn"
id="loginBtn"
>
Đăng nhập
</button>

<button
class="auth-btn"
id="registerBtn"
>
Tạo tài khoản
</button>

</div>

</div>

<!-- FINDING -->

<div
class="finding"
id="finding"
>

<div class="loader"></div>

<h2>
Đang tìm người lạ...
</h2>

<button id="findingLogoutBtn">
Logout
</button>

</div>

<!-- APP -->

<div class="app">

<div class="topbar">

<div class="top-left">

<div class="logo">
✦ Nova Stranger
</div>

<div
class="status"
id="status"
>
● Offline
</div>

</div>

<div class="top-actions">

<button
class="top-btn logout-btn"
id="logoutBtn"
>
Logout
</button>

<button
class="top-btn next-btn"
id="nextBtn"
>
Next
</button>

</div>

</div>

<div
class="messages"
id="messages"
></div>

<div class="bottom">

<input
class="message-input"
id="messageInput"
placeholder="Nhắn gì đó..."
>

<button
class="send-btn"
id="heartBtn"
>
💖
</button>

<button
class="send-btn"
id="sendBtn"
>
➤
</button>

</div>

</div>

<script>

/* FIREBASE */

firebase.initializeApp({

apiKey: "YOUR_API_KEY",
authDomain: "YOUR_PROJECT.firebaseapp.com",
databaseURL: "YOUR_DATABASE_URL",
projectId: "YOUR_PROJECT_ID",
storageBucket: "YOUR_PROJECT.appspot.com",
messagingSenderId: "123456",
appId: "YOUR_APP_ID",

});

const db =
firebase.database();

/* ELEMENT */

const auth =
document.getElementById("auth");

const finding =
document.getElementById("finding");

const messages =
document.getElementById("messages");

const statusEl =
document.getElementById("status");

const usernameInput =
document.getElementById("username");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const registerBtn =
document.getElementById("registerBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const findingLogoutBtn =
document.getElementById(
"findingLogoutBtn"
);

const nextBtn =
document.getElementById("nextBtn");

const sendBtn =
document.getElementById("sendBtn");

const heartBtn =
document.getElementById("heartBtn");

const messageInput =
document.getElementById(
"messageInput"
);

/* USER */

let myId =
localStorage.getItem(
"nova_user_id"
);

let myUsername =
localStorage.getItem(
"nova_username"
);

let roomId = null;

let loaded = false;

/* AUTO LOGIN */

if(myId){

auth.style.display =
"none";

startSystem();

}

/* REGISTER */

registerBtn.onclick =
async ()=>{

const username =
usernameInput.value.trim();

const password =
passwordInput.value.trim();

if(
!username ||
!password
){

return alert(
"Nhập đủ 😭"
);

}

const snap =
await db.ref("users")
.orderByChild("username")
.equalTo(username)
.once("value");

if(snap.exists()){

return alert(
"Tên tồn tại 😭"
);

}

const uid =
"user_" +
Math.random()
.toString(36)
.slice(2);

await db.ref(
"users/" + uid
).set({

username,
password

});

alert(
"Tạo thành công ✨"
);

};

/* LOGIN */

loginBtn.onclick =
async ()=>{

const username =
usernameInput.value.trim();

const password =
passwordInput.value.trim();

const snap =
await db.ref("users")
.orderByChild("username")
.equalTo(username)
.once("value");

if(!snap.exists()){

return alert(
"Không tồn tại 😭"
);

}

let ok = false;

snap.forEach((s)=>{

const data =
s.val();

if(
data.password === password
){

ok = true;

myId = s.key;

myUsername =
data.username;

}

});

if(!ok){

return alert(
"Sai mật khẩu 😭"
);

}

localStorage.setItem(
"nova_user_id",
myId
);

localStorage.setItem(
"nova_username",
myUsername
);

auth.style.display =
"none";

startSystem();

};

/* START */

function startSystem(){

findPartner();

}

/* FIND */

async function findPartner(){

finding.style.display =
"flex";

const waitingRef =
db.ref("waitingUsers");

const snap =
await waitingRef.once("value");

let found = null;

snap.forEach((s)=>{

if(
s.key !== myId &&
!found
){

found = s.key;

}

});

if(found){

roomId =
"room_" +
Date.now();

await db.ref(
"rooms/" + roomId
).set({

users:{
a:myId,
b:found
}

});

await waitingRef
.child(found)
.remove();

startChat();

}else{

await waitingRef
.child(myId)
.set(true);

waitingRef.on(
"child_removed",
async (s)=>{

if(
s.key === myId
){

const rooms =
await db.ref("rooms")
.once("value");

rooms.forEach((r)=>{

const d =
r.val();

if(

d.users &&

(
d.users.a === myId ||
d.users.b === myId
)

){

roomId =
r.key;

}

});

if(roomId){

startChat();

}

}

}
);

}

}

/* CHAT */

function startChat(){

if(loaded)
return;

loaded = true;

finding.style.display =
"none";

statusEl.innerHTML =
"● Đã kết nối";

/* ONLINE */

const onlineRef =
db.ref(

"rooms/" +
roomId +
"/online/" +
myId

);

onlineRef.set(true);

onlineRef.onDisconnect()
.remove();

db.ref(
"rooms/" +
roomId +
"/online"
).on(
"value",
(snap)=>{

const online =
snap.val();

if(
online &&
Object.keys(online)
.length >= 2
){

statusEl.innerHTML =
"● Đã kết nối";

}else{

statusEl.innerHTML =
"● Người kia đã thoát 😢";

}

}
);

/* MESSAGE */

db.ref(
"rooms/" +
roomId +
"/messages"
).on(
"child_added",
(snapshot)=>{

const data =
snapshot.val();

const row =
document.createElement(
"div"
);

row.className =
"row " +
(
data.user === myId
? "me"
: ""
);

row.innerHTML = `

<div class="msg">

<div class="username">
${data.username}
</div>

<div>
${data.text}
</div>

</div>

`;

messages.appendChild(
row
);

messages.scrollTop =
messages.scrollHeight;

}
);

/* HEART */

db.ref(
"rooms/" +
roomId +
"/effects"
).on(
"child_added",
(snapshot)=>{

const data =
snapshot.val();

if(
data.type === "heart"
){

spawnHearts();

}

}
);

}

/* SEND */

function sendMessage(){

const text =
messageInput.value.trim();

if(
!text ||
!roomId
) return;

db.ref(
"rooms/" +
roomId +
"/messages"
).push({

text:text,

username:
myUsername,

user:myId

});

messageInput.value =
"";

}

sendBtn.onclick =
sendMessage;

messageInput.addEventListener(
"keydown",
(e)=>{

if(e.key === "Enter"){

sendMessage();

}

}
);

/* HEART */

function spawnHearts(){

for(let i=0;i<100;i++){

const heart =
document.createElement(
"div"
);

heart.className =
"heart";

heart.innerHTML =
"💖";

heart.style.left =
Math.random()*100+"vw";

heart.style.fontSize =
18+Math.random()*28+"px";

heart.style.animationDuration =
3+Math.random()*3+"s";

document.body.appendChild(
heart
);

setTimeout(()=>{

heart.remove();

},6000);

}

}

heartBtn.onclick =
function(){

if(!roomId)
return;

db.ref(
"rooms/" +
roomId +
"/effects"
).push({

type:"heart"

});

};

/* NEXT */

nextBtn.onclick =
async function(){

if(roomId){

await db.ref(
"rooms/" +
roomId +
"/online/" +
myId
).remove();

}

location.reload();

};

/* LOGOUT */

async function logoutNow(){

if(roomId){

await db.ref(
"rooms/" +
roomId +
"/online/" +
myId
).remove();

}

localStorage.removeItem(
"nova_user_id"
);

localStorage.removeItem(
"nova_username"
);

location.reload();

}

logoutBtn.onclick =
logoutNow;

findingLogoutBtn.onclick =
logoutNow;

</script>

</body>
</html>
